name: Android build validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "docs/**", "design/**"]

permissions:
  contents: read

jobs:
  debug-build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" SDK package is no longer published.
          packages: "platform-tools"

      - name: Inspect available Android SDK packages
        run: |
          sdkmanager --list | grep -E "platforms;android-36|build-tools;36" || true

      - name: Install Android platform
        run: |
          sdkmanager "platforms;android-36.1"
          sdkmanager "build-tools;36.0.0"
          sdkmanager "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create CI debug signing key
        run: |
          keytool -genkeypair -noprompt \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Assemble debug APK and run lint
        run: gradle :app:assembleDebug :app:lintDebug --stacktrace
